repos:
  # -------------------------
  # Ruff: formatter + linter
  # -------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.4   # <-- pin to latest Ruff version
    hooks:
      - id: ruff
        name: Ruff Lint (with autofix)
        args: ["--fix"]     # same as: ruff check --fix

      - id: ruff-format
        name: Ruff Format   # same as: ruff format

  # -------------------------
  # Pyright: static typing
  # -------------------------
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.386   # <-- pin to latest Pyright version
    hooks:
      - id: pyright
        name: Pyright type checking
        # Optional: speed up by only checking changed files
        args: ["--warnings"]
